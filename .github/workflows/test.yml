name: Test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch gptme API drift early

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
        gptme: [pypi, master]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install template and current gptme
        run: |
          uv sync --extra test --upgrade-package gptme
          if [ "${{ matrix.gptme }}" = "master" ]; then
            uv pip install "gptme @ git+https://github.com/gptme/gptme"
          fi
      - name: Test provider contracts
        run: uv run --no-sync pytest -q
      - name: Verify model discovery
        run: |
          uv run --no-sync gptme-util models list --provider example --json > /tmp/models.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          models = json.loads(Path("/tmp/models.json").read_text())
          assert {model["full"] for model in models} == {
              "example/large",
              "example/balanced",
              "example/fast",
          }
          PY
